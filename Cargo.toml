[package]
name = "llm-gateway"
version = "0.10.0"
edition = "2021"
rust-version = "1.85"
description = "A single local endpoint that fronts Claude Code, Codex CLI, opencode and OpenClaw, with model routing, fallback, cost accounting and auditable routing decisions."
license = "MIT OR Apache-2.0"
repository = "https://github.com/NAKAK10/llm-gateway"
readme = "README.md"
keywords = ["llm", "gateway", "proxy", "anthropic", "openai"]
categories = ["command-line-utilities", "web-programming::http-server"]

[features]
default = ["semantic"]
# Content classification (issue #2): static embeddings via model2vec-rs, used
# to classify every request against every route's `description` and pick the
# route whose text is the closest match — the only routing mechanism this
# gateway has. On by default: `init` downloads the ~500MB embedding model
# unconditionally, and a build without this feature always falls back to the
# reserved `default` route without classifying anything. Opt out with
# `--no-default-features` for a smaller build that only ever forwards to
# `default`.
semantic = ["dep:model2vec-rs", "dep:sha2"]

[dependencies]
arc-swap = "1.9.2"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.4", features = ["derive"] }
cliclack = "0.5.5"
comfy-table = "7.2.2"
etcetera = "0.10.0"
futures-util = "0.3.33"
http = "1.5.0"
json5 = "1.3.1"
model2vec-rs = { version = "0.2", default-features = false, features = ["local-only", "fancy-regex"], optional = true }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.10", optional = true }
thiserror = "2.0.19"
time = { version = "0.3.45", features = ["formatting", "macros", "local-offset"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
