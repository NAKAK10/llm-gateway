name: release

# Branch model: `dev` is the default working branch. Merging `dev` into `main`
# is the release trigger — this workflow reads the version from Cargo.toml,
# and if `v{version}` has not been released yet it builds macOS binaries,
# publishes a GitHub Release, and pushes an updated formula to
# NAKAK10/homebrew-tap (via the TAP_DEPLOY_KEY secret, a write-scoped deploy
# key on the tap repo).
#
# To ship: bump `version` in Cargo.toml on dev, merge to main. A merge without
# a version bump is a no-op here (the tag already exists), so docs-only merges
# are safe.

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: llm-gateway

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version and check for an existing release
        id: meta
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already exists — nothing to release"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.meta.outputs.released == 'false'
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        if: steps.meta.outputs.released == 'false'

      - name: Test
        if: steps.meta.outputs.released == 'false'
        run: cargo test --features semantic

      - name: Build both architectures
        if: steps.meta.outputs.released == 'false'
        # `semantic` is on for the distributed (Homebrew) binary so semantic
        # routing is available without a source build.
        run: |
          cargo build --release --features semantic --target aarch64-apple-darwin
          cargo build --release --features semantic --target x86_64-apple-darwin

      - name: Package
        if: steps.meta.outputs.released == 'false'
        id: package
        run: |
          V=${{ steps.meta.outputs.version }}
          mkdir -p dist
          for TARGET in aarch64-apple-darwin x86_64-apple-darwin; do
            tar -C "target/$TARGET/release" -czf "dist/$BIN-v$V-$TARGET.tar.gz" "$BIN"
          done
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS)
          echo "sha_arm=$(shasum -a 256 dist/$BIN-v$V-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sha_x86=$(shasum -a 256 dist/$BIN-v$V-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.meta.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.meta.outputs.version }}
          gh release create "v$V" dist/* \
            --title "v$V" \
            --generate-notes \
            --target "$GITHUB_SHA"

      - name: Update Homebrew tap
        if: steps.meta.outputs.released == 'false'
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          V=${{ steps.meta.outputs.version }}
          SHA_ARM=${{ steps.package.outputs.sha_arm }}
          SHA_X86=${{ steps.package.outputs.sha_x86 }}

          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o StrictHostKeyChecking=accept-new"

          git clone --depth 1 git@github.com:NAKAK10/homebrew-tap.git tap
          mkdir -p tap/Formula
          # The formula is regenerated wholesale from this template each
          # release; edit it here, not in the tap repo.
          cat > tap/Formula/llm-gateway.rb <<EOF
          # typed: false
          # frozen_string_literal: true

          # Auto-generated by NAKAK10/llm-gateway .github/workflows/release.yml — do not edit here.
          class LlmGateway < Formula
            desc "One local endpoint for Claude Code, Codex CLI, opencode and OpenClaw"
            homepage "https://github.com/NAKAK10/llm-gateway"
            version "$V"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/NAKAK10/llm-gateway/releases/download/v$V/llm-gateway-v$V-aarch64-apple-darwin.tar.gz"
                sha256 "$SHA_ARM"
              else
                url "https://github.com/NAKAK10/llm-gateway/releases/download/v$V/llm-gateway-v$V-x86_64-apple-darwin.tar.gz"
                sha256 "$SHA_X86"
              end
            end

            def install
              bin.install "llm-gateway"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/llm-gateway --version")
            end
          end
          EOF

          cd tap
          git config user.name "llm-gateway-release"
          git config user.email "actions@github.com"
          git add Formula/llm-gateway.rb
          git commit -m "llm-gateway v$V"
          git push origin HEAD
